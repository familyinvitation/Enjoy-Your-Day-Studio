name: Enjoy Your Day Studio videos
on:
  push:
    paths:
      - names-template.csv
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      preview:
        description: 'Generate previews only (no uploads or CSV edits)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: birthday-queue
  cancel-in-progress: false
jobs:
  birthdays:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_QUEUE_BRANCH: ${{ github.event.repository.default_branch }}
      QUEUE_FILE: names-template.csv
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      PIPER_MODEL_DIR: .cache/piper
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'private' }}
      MADE_FOR_KIDS: ${{ vars.MADE_FOR_KIDS }}
      MAX_PER_RUN: '1'
      UPLOADS_ENABLED: ${{ vars.UPLOADS_ENABLED || 'false' }}
      PREVIEW: ${{ inputs.preview }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - name: Cache Piper voice files
        uses: actions/cache@v4
        with:
          path: .cache/piper
          key: piper-ljspeech-medium-c10ece1a-v1
      - name: Cache animal thumbnails
        uses: actions/cache@v4
        with:
          path: .cache/animal-thumbnails
          key: animal-thumbnails-${{ github.run_id }}
          restore-keys: animal-thumbnails-
      - name: Process queue
        shell: bash
        run: |
          if [ "$PREVIEW" = "true" ]; then
            python -m src.main --preview
          elif [ "$UPLOADS_ENABLED" = "true" ]; then
            python -m src.main
          else
            echo "Uploads disabled. Use manual preview or set UPLOADS_ENABLED=true after setup."
          fi
      - name: Save preview videos
        if: inputs.preview == true
        uses: actions/upload-artifact@v4
        with:
          name: birthday-previews
          path: |
            output/*.mp4
            output/*.jpg
            output/*.sources.json
          retention-days: 3
          if-no-files-found: warn
